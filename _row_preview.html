<!DOCTYPE html>
<html>

<head>
    <title>Row Preview</title>
    <style>
        body {
            background: #222;
            color: #fff;
            font-family: monospace;
            padding: 20px;
        }

        .row-block {
            margin-bottom: 30px;
        }

        .row-block h2 {
            color: #0f0;
            font-size: 24px;
        }

        .row-block img {
            image-rendering: pixelated;
            height: 120px;
            background: #444;
            border: 2px solid #555;
        }
    </style>
</head>

<body>
    <h1>All 5 Rows — Pick the Running One</h1>
    <div class="row-block">
        <h2>Row 0 (row_0.png) — currently: IDLE</h2><img src="assets/images/row_0.png">
    </div>
    <div class="row-block">
        <h2>Row 1 (row_1.png) — currently: FALLING</h2><img src="assets/images/row_1.png">
    </div>
    <div class="row-block">
        <h2>Row 2 (row_2.png) — currently: DASH</h2><img src="assets/images/row_2.png">
    </div>
    <div class="row-block">
        <h2>Row 3 (row_3.png) — currently: RUNNING</h2><img src="assets/images/row_3.png">
    </div>
    <div class="row-block">
        <h2>Row 4 (row_4.png) — currently: JUMPING</h2><img src="assets/images/row_4.png">
    </div>
</body>

</html>
